<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM de Candidaturas | Bruno Labanca</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f5f7fa;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-muted: #6b7280;
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --border: #e5e7eb;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;
      --purple: #8b5cf6;
      --gray: #6b7280;
    }

    body.dark {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-dark: #60a5fa;
      --border: #334155;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
      transition: background 0.3s, color 0.3s;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    /* ===== TOPO ===== */
    .topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

    .topo h1 {
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topo h1 i { color: var(--primary); }

    .topo-acoes {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn:hover { background: var(--primary-dark); transform: translateY(-1px); }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-outline:hover { background: var(--border); }

    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #b91c1c; }

    /* ===== DASHBOARD ===== */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: var(--shadow);
      border-left: 4px solid var(--primary);
    }

    .stat .num {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text);
    }

    .stat .lbl {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat.enviada { border-left-color: var(--info); }
    .stat.analise { border-left-color: var(--warning); }
    .stat.entrevista { border-left-color: var(--purple); }
    .stat.aprovada { border-left-color: var(--success); }
    .stat.recusada { border-left-color: var(--danger); }

    /* ===== FILTROS ===== */
    .filtros {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .filtros input,
    .filtros select {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    .filtros input { flex: 1; min-width: 200px; }

    .filtros input:focus,
    .filtros select:focus { border-color: var(--primary); }

    /* ===== LISTA DE VAGAS ===== */
    .vagas-lista {
      display: grid;
      gap: 14px;
    }

    .vaga-item {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 18px;
      box-shadow: var(--shadow);
      border-left: 4px solid var(--gray);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .vaga-item:hover {
      transform: translateX(4px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
    }

    .vaga-item[data-status="Enviada"] { border-left-color: var(--info); }
    .vaga-item[data-status="Em análise"] { border-left-color: var(--warning); }
    .vaga-item[data-status="Entrevista"] { border-left-color: var(--purple); }
    .vaga-item[data-status="Teste técnico"] { border-left-color: var(--purple); }
    .vaga-item[data-status="Aprovada"] { border-left-color: var(--success); }
    .vaga-item[data-status="Recusada"] { border-left-color: var(--danger); }
    .vaga-item[data-status="Desistida"] { border-left-color: var(--gray); }

    .vaga-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .vaga-titulo {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
    }

    .vaga-empresa {
      color: var(--primary);
      font-size: 0.9rem;
      font-weight: 500;
      margin-top: 2px;
    }

    .vaga-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 10px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .vaga-meta i { margin-right: 4px; }

    .vaga-obs {
      margin-top: 10px;
      padding: 10px 12px;
      background: var(--bg);
      border-radius: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-left: 3px solid var(--border);
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
    }

    .badge[data-status="Enviada"] { background: var(--info); }
    .badge[data-status="Em análise"] { background: var(--warning); }
    .badge[data-status="Entrevista"] { background: var(--purple); }
    .badge[data-status="Teste técnico"] { background: var(--purple); }
    .badge[data-status="Aprovada"] { background: var(--success); }
    .badge[data-status="Recusada"] { background: var(--danger); }
    .badge[data-status="Desistida"] { background: var(--gray); }

    .vaga-acoes {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .vaga-acoes button,
    .vaga-acoes a {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }

    .vaga-acoes button:hover,
    .vaga-acoes a:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .vaga-acoes .btn-del:hover {
      background: var(--danger);
      border-color: var(--danger);
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.aberto { display: flex; }

    .modal {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 28px;
      max-width: 560px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    .modal h2 {
      font-size: 1.2rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal h2 i { color: var(--primary); }

    .campo { margin-bottom: 14px; }

    .campo label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .campo input,
    .campo select,
    .campo textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    .campo input:focus,
    .campo select:focus,
    .campo textarea:focus { border-color: var(--primary); }

    .campo textarea { resize: vertical; min-height: 80px; }

    .campo-duplo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .modal-acoes {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    /* ===== VAZIO ===== */
    .vazio {
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: var(--shadow);
      color: var(--text-muted);
    }

    .vazio i {
      font-size: 3rem;
      color: var(--border);
      margin-bottom: 14px;
    }

    /* ===== RESPONSIVO ===== */
    @media (max-width: 600px) {
      body { padding: 12px; }
      .topo h1 { font-size: 1.25rem; }
      .campo-duplo { grid-template-columns: 1fr; }
      .filtros { flex-direction: column; align-items: stretch; }
      .filtros input, .filtros select { width: 100%; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- TOPO -->
  <div class="topo">
    <h1><i class="fas fa-briefcase"></i> CRM de Candidaturas</h1>
    <div class="topo-acoes">
      <a href="index.html" class="btn btn-outline">
        <i class="fas fa-arrow-left"></i> Voltar ao portfólio
      </a>
      <button class="btn btn-outline" id="btn-exportar">
        <i class="fas fa-file-csv"></i> Exportar CSV
      </button>
      <button class="btn" id="btn-nova">
        <i class="fas fa-plus"></i> Nova candidatura
      </button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard" id="dashboard">
    <div class="stat enviada">
      <div class="num" id="stat-total">0</div>
      <div class="lbl">Total</div>
    </div>
    <div class="stat enviada">
      <div class="num" id="stat-enviada">0</div>
      <div class="lbl">Enviadas</div>
    </div>
    <div class="stat analise">
      <div class="num" id="stat-analise">0</div>
      <div class="lbl">Em análise</div>
    </div>
    <div class="stat entrevista">
      <div class="num" id="stat-entrevista">0</div>
      <div class="lbl">Entrevistas</div>
    </div>
    <div class="stat aprovada">
      <div class="num" id="stat-aprovada">0</div>
      <div class="lbl">Aprovadas</div>
    </div>
    <div class="stat recusada">
      <div class="num" id="stat-recusada">0</div>
      <div class="lbl">Recusadas</div>
    </div>
  </div>

  <!-- FILTROS -->
  <div class="filtros">
    <input type="text" id="busca" placeholder="🔍 Buscar por empresa, vaga ou observação...">
    <select id="filtro-status">
      <option value="">Todos os status</option>
      <option value="Enviada">Enviada</option>
      <option value="Em análise">Em análise</option>
      <option value="Entrevista">Entrevista</option>
      <option value="Teste técnico">Teste técnico</option>
      <option value="Aprovada">Aprovada</option>
      <option value="Recusada">Recusada</option>
      <option value="Desistida">Desistida</option>
    </select>
    <select id="ordenacao">
      <option value="recente">Mais recentes</option>
      <option value="antiga">Mais antigas</option>
      <option value="empresa">Empresa (A-Z)</option>
    </select>
  </div>

  <!-- LISTA -->
  <div class="vagas-lista" id="lista-vagas"></div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2><i class="fas fa-plus-circle"></i> <span id="modal-titulo">Nova candidatura</span></h2>

    <form id="form-vaga">
      <input type="hidden" id="vaga-id">

      <div class="campo-duplo">
        <div class="campo">
          <label for="empresa">Empresa *</label>
          <input type="text" id="empresa" required placeholder="Ex.: Banco Itaú">
        </div>
        <div class="campo">
          <label for="cargo">Vaga / Cargo *</label>
          <input type="text" id="cargo" required placeholder="Ex.: Estágio em Contabilidade">
        </div>
      </div>

      <div class="campo-duplo">
        <div class="campo">
          <label for="data">Data da candidatura</label>
          <input type="date" id="data">
        </div>
        <div class="campo">
          <label for="status">Status</label>
          <select id="status">
            <option value="Enviada">Enviada</option>
            <option value="Em análise">Em análise</option>
            <option value="Entrevista">Entrevista</option>
            <option value="Teste técnico">Teste técnico</option>
            <option value="Aprovada">Aprovada</option>
            <option value="Recusada">Recusada</option>
            <option value="Desistida">Desistida</option>
          </select>
        </div>
      </div>

      <div class="campo">
        <label for="link">Link da vaga</label>
        <input type="url" id="link" placeholder="https://...">
      </div>

      <div class="campo">
        <label for="obs">Observações</label>
        <textarea id="obs" placeholder="Anotações, contatos, próximos passos..."></textarea>
      </div>

      <div class="modal-acoes">
        <button type="button" class="btn btn-outline" id="btn-cancelar">Cancelar</button>
        <button type="submit" class="btn">
          <i class="fas fa-save"></i> Salvar
        </button>
      </div>
    </form>
  </div>
</div>

<script>
/* =========================================================
   CRM DE CANDIDATURAS — localStorage
   ========================================================= */

const STORAGE_KEY = 'crm_vagas_bruno';

let vagas = carregar();
let editandoId = null;

/* -------- Persistência -------- */
function carregar() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    return [];
  }
}

function salvar() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(vagas));
}

function gerarId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* -------- Formatar data -------- */
function formatarData(iso) {
  if (!iso) return '—';
  const [a, m, d] = iso.split('-');
  return `${d}/${m}/${a}`;
}

/* -------- Renderizar dashboard -------- */
function renderDashboard() {
  const total = vagas.length;
  const contar = (s) => vagas.filter(v => v.status === s).length;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-enviada').textContent = contar('Enviada');
  document.getElementById('stat-analise').textContent = contar('Em análise');
  document.getElementById('stat-entrevista').textContent =
    contar('Entrevista') + contar('Teste técnico');
  document.getElementById('stat-aprovada').textContent = contar('Aprovada');
  document.getElementById('stat-recusada').textContent = contar('Recusada');
}

/* -------- Renderizar lista -------- */
function renderLista() {
  const busca = document.getElementById('busca').value.toLowerCase().trim();
  const statusFiltro = document.getElementById('filtro-status').value;
  const ordem = document.getElementById('ordenacao').value;

  let filtradas = vagas.filter(v => {
    const bateBusca =
      !busca ||
      v.empresa.toLowerCase().includes(busca) ||
      v.cargo.toLowerCase().includes(busca) ||
      (v.obs || '').toLowerCase().includes(busca);

    const bateStatus = !statusFiltro || v.status === statusFiltro;
    return bateBusca && bateStatus;
  });

  filtradas.sort((a, b) => {
    if (ordem === 'recente') return (b.data || '').localeCompare(a.data || '');
    if (ordem === 'antiga') return (a.data || '').localeCompare(b.data || '');
    if (ordem === 'empresa') return a.empresa.localeCompare(b.empresa);
    return 0;
  });

  const lista = document.getElementById('lista-vagas');

  if (filtradas.length === 0) {
    lista.innerHTML = `
      <div class="vazio">
        <i class="fas fa-inbox"></i>
        <p>${vagas.length === 0
          ? 'Nenhuma candidatura cadastrada ainda. Clique em <strong>Nova candidatura</strong> para começar.'
          : 'Nenhuma candidatura encontrada com os filtros atuais.'}</p>
      </div>`;
    return;
  }

  lista.innerHTML = filtradas.map(v => `
    <div class="vaga-item" data-status="${v.status}">
      <div class="vaga-header">
        <div>
          <div class="vaga-titulo">${escapar(v.cargo)}</div>
          <div class="vaga-empresa">${escapar(v.empresa)}</div>
        </div>
        <span class="badge" data-status="${v.status}">${v.status}</span>
      </div>

      <div class="vaga-meta">
        <span><i class="fas fa-calendar"></i> ${formatarData(v.data)}</span>
        ${v.link ? `<span><i class="fas fa-link"></i> <a href="${escapar(v.link)}" target="_blank" rel="noopener" style="color:var(--primary)">Ver vaga</a></span>` : ''}
      </div>

      ${v.obs ? `<div class="vaga-obs">${escapar(v.obs)}</div>` : ''}

      <div class="vaga-acoes">
        <button onclick="editarVaga('${v.id}')"><i class="fas fa-edit"></i> Editar</button>
        <button onclick="mudarStatus('${v.id}')"><i class="fas fa-sync"></i> Mudar status</button>
        <button class="btn-del" onclick="excluirVaga('${v.id}')"><i class="fas fa-trash"></i> Excluir</button>
      </div>
    </div>
  `).join('');
}

function escapar(txt) {
  const d = document.createElement('div');
  d.textContent = txt ?? '';
  return d.innerHTML;
}

/* -------- Modal -------- */
const overlay = document.getElementById('modal-overlay');
const form = document.getElementById('form-vaga');

function abrirModal(titulo = 'Nova candidatura', dados = null) {
  document.getElementById('modal-titulo').textContent = titulo;
  document.getElementById('vaga-id').value = dados?.id || '';
  document.getElementById('empresa').value = dados?.empresa || '';
  document.getElementById('cargo').value = dados?.cargo || '';
  document.getElementById('data').value = dados?.data || new Date().toISOString().slice(0, 10);
  document.getElementById('status').value = dados?.status || 'Enviada';
  document.getElementById('link').value = dados?.link || '';
  document.getElementById('obs').value = dados?.obs || '';
  overlay.classList.add('aberto');
  setTimeout(() => document.getElementById('empresa').focus(), 100);
}

function fecharModal() {
  overlay.classList.remove('aberto');
  form.reset();
  editandoId = null;
}

document.getElementById('btn-nova').addEventListener('click', () => abrirModal());
document.getElementById('btn-cancelar').addEventListener('click', fecharModal);
overlay.addEventListener('click', e => { if (e.target === overlay) fecharModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });

/* -------- Salvar -------- */
form.addEventListener('submit', e => {
  e.preventDefault();
  const id = document.getElementById('vaga-id').value;

  const dados = {
    empresa: document.getElementById('empresa').value.trim(),
    cargo: document.getElementById('cargo').value.trim(),
    data: document.getElementById('data').value,
    status: document.getElementById('status').value,
    link: document.getElementById('link').value.trim(),
    obs: document.getElementById('obs').value.trim(),
  };

  if (id) {
    const i = vagas.findIndex(v => v.id === id);
    if (i > -1) vagas[i] = { ...vagas[i], ...dados };
  } else {
    vagas.push({ id: gerarId(), ...dados, criadoEm: new Date().toISOString() });
  }

  salvar();
  renderTudo();
  fecharModal();
});

/* -------- Ações -------- */
window.editarVaga = function (id) {
  const v = vagas.find(x => x.id === id);
  if (v) abrirModal('Editar candidatura', v);
};

window.excluirVaga = function (id) {
  const v = vagas.find(x => x.id === id);
  if (!v) return;
  if (confirm(`Excluir a candidatura "${v.cargo}" da empresa "${v.empresa}"?`)) {
    vagas = vagas.filter(x => x.id !== id);
    salvar();
    renderTudo();
  }
};

window.mudarStatus = function (id) {
  const v = vagas.find(x => x.id === id);
  if (!v) return;
  const opcoes = ['Enviada', 'Em análise', 'Entrevista', 'Teste técnico', 'Aprovada', 'Recusada', 'Desistida'];
  const novo = prompt(
    `Status atual: ${v.status}\n\nDigite o novo status:\n${opcoes.join(' | ')}`,
    v.status
  );
  if (novo && opcoes.includes(novo)) {
    v.status = novo;
    salvar();
    renderTudo();
  } else if (novo) {
    alert('Status inválido.');
  }
};

/* -------- Exportar CSV -------- */
document.getElementById('btn-exportar').addEventListener('click', () => {
  if (vagas.length === 0) {
    alert('Nenhuma candidatura para exportar.');
    return;
  }

  const cabecalho = ['Empresa', 'Cargo', 'Data', 'Status', 'Link', 'Observações'];
  const linhas = vagas.map(v => [
    v.empresa,
    v.cargo,
    formatarData(v.data),
    v.status,
    v.link || '',
    (v.obs || '').replace(/\n/g, ' '),
  ]);

  const csv = [cabecalho, ...linhas]
    .map(l => l.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';'))
    .join('\n');

  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `candidaturas_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

/* -------- Filtros -------- */
document.getElementById('busca').addEventListener('input', renderLista);
document.getElementById('filtro-status').addEventListener('change', renderLista);
document.getElementById('ordenacao').addEventListener('change', renderLista);

/* -------- Render geral -------- */
function renderTudo() {
  renderDashboard();
  renderLista();
}

/* -------- Inicialização -------- */
renderTudo();
</script>
